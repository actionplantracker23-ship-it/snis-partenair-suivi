<style>
:root{
  --navy:#081C7E; --navy-dark:#06155F; --bg:#F7F8FA; --card:#FFFFFF; --line:#E2E5EA; --text:#212529; --muted:#6B7280;
  --teal:#00CEC0; --hover:#F1F3F6; --danger:#C62828;
  box-sizing:border-box;
}
:root[data-theme="dark"]{--bg:#F7F8FA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#F7F8FA}}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:"EB Garamond",Garamond,"Times New Roman",serif;font-variant-numeric:lining-nums;background:var(--bg);color:var(--text);font-size:18px;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #4C6FFF;outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Barre du haut */
.appbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;min-height:64px;flex:none}
.appbar .ib{background:none;border:0;color:#fff;padding:8px;border-radius:50%;display:grid;place-items:center}
.appbar .ib:hover{background:rgba(255,255,255,.12)}
.applogo{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.applogo svg{width:30px;height:30px}
.appbar h1{font-size:1.45rem;font-weight:400;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .acts{display:flex;gap:6px}
.searchbar{background:var(--navy);padding:0 16px 12px;flex:none}
.searchbar input{width:100%;border:0;border-radius:6px;padding:10px 12px;background:#fff;color:var(--text)}

main{flex:1;overflow:auto;position:relative}
.pad{padding:24px}

/* Barre du bas */
nav.bottom{background:var(--navy);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;flex:none;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom a{color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;font-size:.95rem;position:relative;opacity:.95}
nav.bottom a.on{font-weight:500}
nav.bottom a.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:4px;background:#fff;border-radius:3px 3px 0 0}
.formbar{background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:18vw;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));flex:none}
.formbar button{background:none;border:0;font-size:1.15rem;padding:6px 18px}
.formbar .save{color:var(--navy);font-weight:600}

/* FAB */
.fabs{position:fixed;right:24px;bottom:calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;z-index:5}
.fab{width:66px;height:66px;border-radius:50%;background:var(--navy);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.28)}
.fab svg.i{width:30px;height:30px}

/* Grille des partenaires */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px 24px;padding:24px}
.ptile{container-type:inline-size;background:#fff;border:1px solid var(--line);height:272px;position:relative;overflow:hidden;cursor:pointer;padding:0;text-align:left;border-radius:2px}
.ptile:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.ptile img{width:100%;height:100%;object-fit:contain;display:block}
.ptile .mono{width:100%;height:100%;display:grid;place-items:center;font-size:4.2rem;font-weight:600;letter-spacing:.01em;background:#fff!important;padding:0 12px 40px;text-align:center;line-height:1}
.ptile .nm{position:absolute;left:36px;top:50%;margin-top:60px;font-size:1.3rem;color:#111;background:rgba(255,255,255,.6);padding:0 2px}

/* Fiche détail */
.detail{max-width:924px;margin:0 auto;background:#fff;min-height:100%}
.fld{padding:14px 20px 4px}
.fld .lb{font-size:.85rem;color:#444;margin-bottom:6px}
.fld .vl{font-size:1.35rem;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.fld .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fld a.mail{color:var(--muted)}
.photo{position:relative;display:flex;align-items:center;justify-content:center;padding:10px 20px 30px;min-height:180px}
.photo img{max-width:100%;max-height:220px;object-fit:contain}
.photo .mono{min-width:200px;height:150px;display:grid;place-items:center;font-size:4rem;font-weight:600;background:#fff!important}
.navarr{position:fixed;top:50%;width:66px;height:66px;border-radius:50%;background:#E9EAED;border:0;display:grid;place-items:center;color:#555;z-index:3}
.navarr.l{left:calc(50% - 530px)}.navarr.r{right:calc(50% - 530px)}
.sep{border-top:2px solid var(--line);margin:8px 0}
.relhead{display:flex;align-items:center;gap:10px;padding:16px 20px;font-size:.95rem}
.badge{background:#EEF0F3;border-radius:3px;padding:1px 6px;font-size:1.05rem}
.chart{padding:0 20px 20px}
.rel{border-top:1px solid var(--line)}
.rel button{display:flex;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 20px;gap:12px;justify-content:space-between;align-items:center}
.rel button:hover{background:var(--hover)}
.rel .t{font-size:1rem}.rel .s{font-size:.85rem;color:var(--muted);margin-top:3px}
.stat-icon{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 0 6px;font-size:.8rem;font-weight:600;color:#333}
.stat-icon span{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.datein{border:1px solid #ccc;border-radius:4px;padding:12px 14px;font-size:1.3rem;width:100%;margin-top:4px}
.note{display:flex;gap:16px;padding:14px 20px;border-top:1px solid var(--line);align-items:flex-start}
.note svg.i{width:38px;height:38px;color:#2D6BEE}
.note .d{color:var(--muted);font-size:.9rem}
.note .x{margin-top:4px;white-space:pre-wrap}

/* Kanban */
.kanban{display:flex;gap:14px;padding:12px 10px;height:100%;overflow-x:auto}
.kcol{background:#fff;border:1px solid var(--line);min-width:230px;flex:1;display:flex;flex-direction:column;max-height:100%}
.kcol h2{font-size:1.15rem;font-weight:600;margin:0;padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.kcol h2 small{font-weight:400;color:var(--muted);font-size:.85rem}
.klist{overflow-y:auto;flex:1}
.kcard{display:flex;gap:6px;padding:14px 12px 14px 28px;cursor:pointer;border-bottom:1px solid #F0F1F3}
.kcard:hover,.kcard.sel{background:#F2F2F2}
.kcard .t{font-size:1.15rem;line-height:1.3}
.kcard .p{font-size:.85rem;color:var(--muted);margin-top:4px}
.kcard .more{background:none;border:0;padding:4px;align-self:center;color:#444}
.empty{display:grid;place-items:center;height:100%;min-height:200px;color:#555;font-size:1.1rem}
.kdetail{background:#fff;border:1px solid var(--line);min-width:300px;flex:1.2;display:flex;flex-direction:column;max-height:100%}
.kdetail .body{overflow-y:auto;flex:1;position:relative}
.kdetail .ifabs{position:sticky;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:14px;padding-right:12px;pointer-events:none}
.kdetail .ifabs .fab{pointer-events:auto}

/* Tableau inline */
table.inline{border-collapse:collapse;width:100%;min-width:900px;background:#fff}
.inline th{text-align:left;font-weight:400;font-size:1.05rem;padding:16px 15px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);position:sticky;top:0;background:#fff}
.inline td{padding:14px 15px;border-bottom:1px solid var(--line);font-size:1.02rem;max-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inline tr.grp td{background:#F7F8FA;padding:14px 15px}
.inline tr.it{cursor:pointer}.inline tr.it:hover{background:var(--hover)}

/* Calendrier */
.cal{display:grid;grid-template-columns:minmax(300px,1fr) 2fr;gap:14px;padding:12px;height:100%}
.panel{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel>h2{font-size:1.15rem;font-weight:600;margin:0;padding:12px 18px}
.uplist{overflow-y:auto;flex:1}
.update{background:#F7F8FA;padding:8px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.upit{padding:12px 14px 6px 20px;cursor:pointer;border-bottom:1px solid var(--line)}
.upit:hover{background:var(--hover)}
.upit .r1{display:flex;justify-content:space-between;gap:12px;font-weight:500}
.upit .r1 span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upit .r1 small{font-weight:400;white-space:nowrap}
.upit .p{color:#444;margin-top:6px}
.upit .c{display:flex;justify-content:flex-end;color:#555}
.calmodes{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line);padding:0 18px}
.calmodes .m{grid-column:2;display:flex;gap:20px}
.calmodes button{background:none;border:0;font-size:1.3rem;color:#777;padding:14px 0 8px;border-bottom:3px solid transparent}
.calmodes button.on{color:#222;border-bottom-color:var(--navy)}
.calmodes .today{justify-self:end;color:var(--navy);font-weight:600;font-size:1.2rem}
.calnav{display:flex;justify-content:center;align-items:center;gap:90px;padding:16px 0 8px;font-size:1.3rem}
.calnav button{background:none;border:0;padding:4px 10px}
.month{display:grid;grid-template-columns:repeat(7,1fr);flex:1;overflow-y:auto}
.month .dh{text-align:center;color:#555;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.month .dc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:96px;padding:6px 4px;text-align:center;font-size:1.05rem}
.month .dc.out{color:transparent}
.month .num{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%}
.month .num.today{background:var(--navy);color:#fff;font-weight:600}
.evt{display:block;width:100%;background:var(--navy);color:#fff;border:0;border-radius:3px;font-size:.75rem;padding:2px 4px;margin-top:3px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daylist{padding:10px 18px;overflow-y:auto}

/* Formulaires */
.form{max-width:720px;margin:0 auto;background:#fff;padding:40px 36px 30px}
.frow{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start;margin-bottom:28px}
.frow>label{color:#555;padding-top:14px}
.frow input:not([type=checkbox]),.frow select,.frow textarea{width:100%;border:1px solid #BFC3C9;border-radius:3px;padding:16px 14px;background:#fff}
.frow textarea{min-height:100px;resize:vertical}
.filebox{border:1px solid #BFC3C9;border-radius:3px;min-height:84px;display:grid;place-items:center;cursor:pointer;color:#555;text-align:center;padding:10px}
.filebox img{max-height:120px;max-width:100%}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;padding-top:10px}
.checks label{display:flex;gap:8px;align-items:center}
.req{color:var(--danger)}

/* Liste générique */
.list{max-width:924px;margin:0 auto;background:#fff}
.list .it{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list .it:hover{background:var(--hover)}
.list .it .t{font-size:1.05rem}.list .it .s{font-size:.85rem;color:var(--muted);margin-top:3px}
.list h3{margin:0;padding:12px 20px;background:#F7F8FA;font-weight:500;font-size:1rem;border-bottom:1px solid var(--line)}

/* Menu latéral */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(446px,86vw);background:#fff;z-index:21;transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;gap:24px;padding:24px 22px;border-bottom:1px solid var(--line)}
.drawer .hd .applogo{width:46px;height:46px;border:1px solid var(--line)}
.drawer .hd .applogo svg{width:40px;height:40px}
.drawer .hd b{font-weight:400;font-size:1.6rem}
.drawer a,.drawer button.mi{display:flex;align-items:center;gap:22px;padding:17px 20px;color:var(--text);text-decoration:none;font-size:1.15rem;background:none;border:0;width:100%;text-align:left}
.drawer a:hover,.drawer button.mi:hover{background:var(--hover)}
.drawer hr{border:0;border-top:1px solid var(--line);margin:4px 14px}
.drawer .ft{margin-top:auto;border-top:1px solid var(--line);padding:22px 20px}
.drawer .user{display:flex;align-items:center;gap:16px;color:var(--muted)}
.drawer .av{width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:1.3rem;flex:none}
.drawer .logout{display:block;margin-left:auto;margin-top:14px;background:none;border:0;color:var(--navy);font-size:1.2rem}

/* Menus contextuels, toast, connexion */
.sheet{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}
.sheet.on{display:flex}
.sheet .box{background:#fff;border-radius:6px;min-width:280px;max-width:92vw;padding:8px 0;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.sheet .box h4{margin:0;padding:12px 20px;font-weight:500;color:var(--muted);font-size:.9rem}
.sheet .box button{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 20px;font-size:1.05rem}
.sheet .box button:hover{background:var(--hover)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323232;color:#fff;padding:12px 18px;border-radius:4px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.login{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);padding:36px;text-align:center}
.login .applogo{margin:0 auto 18px;width:72px;height:72px;border:1px solid var(--line)}
.login .applogo svg{width:62px;height:62px}
.login input{width:100%;border:1px solid #BFC3C9;border-radius:3px;padding:14px;margin:18px 0 12px}
.btnp{background:var(--navy);color:#fff;border:0;border-radius:4px;padding:13px 22px;font-weight:500;width:100%}
.btnp:disabled{opacity:.6;cursor:default}
.login .lf input,.login .lf select{width:100%;border:1px solid #BFC3C9;border-radius:3px;padding:14px;margin:12px 0 0;background:#fff}
.login .lf .btnp{margin-top:20px}
.login .lmsg{color:var(--muted);min-height:1.5em;margin:14px 0 0}
.login .lmsg.err{color:var(--danger)}
.ltabs{display:flex;border-bottom:1px solid var(--line);margin:20px 0 4px}
.ltabs button{flex:1;background:none;border:0;padding:12px 0;color:var(--muted);border-bottom:3px solid transparent}
.ltabs button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:500}
.lnk{background:none;border:0;color:var(--navy);margin-top:16px;text-decoration:underline;padding:4px}

/* Tableau de bord (modèle Shiny : statistiques + synthèse façon gt) */
.dash{max-width:1200px;margin:0 auto;padding:16px 16px 120px;display:grid;gap:16px}
.dbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px}
.seg button{background:none;border:0;padding:9px 16px;border-radius:4px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.dbar select{border:1px solid #BFC3C9;border-radius:4px;padding:10px 12px;background:#fff;min-width:220px;max-width:100%}
.banner{background:#FFF7E0;border:1px solid #F0D58A;padding:12px 16px;border-radius:4px}
.banner.info{background:#EEF3FF;border-color:#C9D6FB}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);padding:14px 16px}
.kpi .l{color:#333;font-size:.85rem}
.kpi .v{font-size:1.9rem;font-weight:600;color:var(--navy);font-variant-numeric:lining-nums tabular-nums;margin-top:6px}
.kpi .v small{font-size:.95rem;font-weight:400;color:var(--muted)}
.kpi.warn .v{color:var(--danger)}
.card{background:#fff;border:1px solid var(--line);min-width:0}
.card>h2{font-size:1.05rem;font-weight:600;margin:0;padding:14px 18px 4px;color:#333}
.card>.sub{margin:0;padding:0 18px 12px;color:var(--muted);font-size:.88rem}
.card .cb{padding:8px 18px 18px}
.dgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:#333}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* Barres empilées (HTML) */
.sbar{display:flex;height:14px;gap:2px;min-width:40px}
.sbar span{height:100%;border-radius:0}
.sbar span:first-child{border-radius:4px 0 0 4px}.sbar span:last-child{border-radius:0 4px 4px 0}.sbar span:only-child{border-radius:4px}
.sbar.empty{background:#EEF0F3;border-radius:4px}
.hbars{display:grid;grid-template-columns:minmax(90px,max-content) 1fr;gap:10px 14px;align-items:center}
.hbars .nm{font-size:.92rem;text-align:right;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.hbars .tr{display:flex;align-items:center;gap:8px;min-width:0}
.hbars .sbar{height:24px}
.hbars .sbar span{display:grid;place-items:center;font-size:.75rem;font-weight:500;overflow:hidden;white-space:nowrap}
.hbars .tot{font-size:.85rem;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
/* Barre de progression (gt_plt_bar_pct) */
.pbar{display:flex;align-items:center;gap:8px;min-width:110px}
.pbar .tk{flex:1;height:12px;background:#E3E5E8;border-radius:4px;overflow:hidden}
.pbar .tk i{display:block;height:100%;background:#2E9E4F;border-radius:4px}
.pbar b{font-weight:500;font-size:.85rem;min-width:38px;text-align:right;font-variant-numeric:lining-nums tabular-nums}
/* Anneau et jauges (SVG) */
.donut{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.donut svg{width:190px;height:190px;flex:none}
.donut .legend{flex-direction:column;gap:8px}
.gauge{width:76px;height:44px;display:block}
/* Tableaux façon gt */
.gtw{overflow-x:auto}
table.gt{width:100%;border-collapse:collapse;font-size:.9rem}
.gt caption{caption-side:top;text-align:center;padding:14px 12px 12px;border-bottom:2px solid #D3D3D3}
.gt caption b{display:block;font-size:1.15rem;font-weight:600;color:#222}
.gt caption span{display:block;color:var(--muted);font-size:.88rem;margin-top:4px}
.gt thead th{background:var(--navy);color:#fff;font-weight:500;text-align:left;padding:10px 12px;border-bottom:2px solid #06155F;white-space:nowrap}
.gt thead tr.sp th{background:#fff;color:#333;border-bottom:1px solid #999;text-align:center;font-weight:500;padding:8px 12px}
.gt thead tr.sp th:empty{border-bottom:0}
.gt th.n,.gt td.n{text-align:right;font-variant-numeric:lining-nums tabular-nums}
.gt td{padding:9px 12px;border-bottom:1px solid #E6E6E6;vertical-align:middle}
.gt tr.grp td{background:#242154;color:#fff;font-weight:500;padding:9px 12px}
.gt tr.grp td small{font-weight:400;opacity:.85;margin-left:8px}
.gt tbody tr.r:hover td{background:#F5F6F8}
.gt tbody tr.r[data-go]{cursor:pointer}
.gt td.cont{border-top-color:transparent;color:transparent}
.gt td.act{font-weight:500}
.gt tr.cont-row td.act{color:transparent}
.gt tr.r:has(+ tr.cont-row) td.act{border-bottom-color:transparent}
.gt .st{display:inline-block;padding:4px 10px;border-radius:3px;font-size:.8rem;font-weight:500;white-space:nowrap}
.gt td.wrap{min-width:220px}
.gt tfoot td{padding:8px 12px;color:var(--muted);font-size:.8rem;border-top:2px solid #D3D3D3}
.tip{position:fixed;z-index:50;pointer-events:none;background:#fff;color:#222;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.15);border-radius:4px;padding:8px 10px;font-size:.85rem;max-width:280px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}

/* Comptes utilisateurs */
.acct{display:grid;grid-template-columns:1.4fr 1.2fr 150px 110px;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.acct select{border:1px solid #BFC3C9;border-radius:3px;padding:10px;background:#fff;width:100%}
.acct .t{overflow-wrap:anywhere}
.acct .s{font-size:.85rem;color:var(--muted);margin-top:3px}
.acct .s.pend{color:#9A5B00}
.acct label{display:flex;gap:8px;align-items:center}

@media (max-width:900px){
  .ptile .mono{padding-bottom:30px}
  .pgrid{grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
  .ptile{height:170px}.ptile .nm{left:12px;margin-top:40px;font-size:1rem}.ptile .mono{font-size:2.2rem}
  .navarr{display:none}
  .kcol,.kdetail{min-width:82vw}
  .kdetail{display:none}
  .cal{grid-template-columns:1fr;height:auto}
  .cal .panel:first-child{max-height:50vh}
  .frow{grid-template-columns:1fr;gap:6px}.frow>label{padding-top:0}
  .form{padding:24px 18px}
  .appbar h1{font-size:1.2rem}
  nav.bottom a{font-size:.8rem}
  .fabs{right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .calnav{gap:30px}
  .dgrid{grid-template-columns:1fr}
  .hbars .nm{max-width:110px;font-size:.82rem}
  .dbar .seg{display:flex;width:100%}.dbar .seg button{flex:1;padding:9px 6px}
  .dbar select{width:100%;min-width:0}
  .card .cb{padding:8px 12px 14px}
  .acct{grid-template-columns:1fr 1fr}.acct .ae{grid-column:1/-1}
  .login{margin:4vh 16px;padding:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const fmtD = d => { if (!d) return ""; const [y,m,j] = d.split("-"); return `${+j}/${+m}/${y}`; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const P = id => db.partenaires.find(p => p.id === id);
const T = id => db.taches.find(t => t.id === id);
const pNames = t => (t.partenaires || []).map(id => P(id)?.nom).filter(Boolean).join(", ");
const match = (...s) => !q || s.join(" ").toLowerCase().includes(q.toLowerCase());
const SLAB = {"Not Started":"Non démarrée","In Progress":"En cours","Complete":"Achevée","En attente":"En attente","Cancel":"Annulée"};
const SCOL = {"Not Started":"#C0392B","In Progress":"#E8A317","Complete":"#2E9E4F","En attente":"#5B6FD6","Cancel":"#9AA3AF"};
const STXT = {"Not Started":"#fff","In Progress":"#1b1b1b","Complete":"#fff","En attente":"#fff","Cancel":"#1b1b1b"};
/* Droits : sans Supabase (mode local) tout est modifiable */
const isAdmin = () => !sb || (me?.role === "admin" && me.actif);
const myP = () => (sb && me?.actif) ? me.partenaire_id : null;
const canCreate = () => isAdmin() || !!myP();
const canEditTask = t => isAdmin() || (!!myP() && (t.partenaires || []).includes(myP()));
const canEditPartner = p => isAdmin() || (!!myP() && p.id === myP());
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),2600); }
function mono(nom){ let h=0; for(const c of nom) h=(h*31+c.charCodeAt(0))>>>0; const [bg,fg]=PAL[h%PAL.length]; return {bg,fg,txt:nom.length<=12?nom:nom.split(/\s+/).map(w=>w[0]).join("").slice(0,4).toUpperCase()}; }

/* ================= Données : local ou Supabase ================= */
const Store = {
  async init(){
    if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) {
      await new Promise((ok, ko) => { const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"; s.onload=ok; s.onerror=ko; document.head.appendChild(s); });
      sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
      const { data } = await sb.auth.getSession(); session = data.session;
      sb.auth.onAuthStateChange((ev, s) => {
        if (ev === "PASSWORD_RECOVERY") { session = s; recovering = true; return boot(); }
        const was = !!session; session = s; if (!s) me = null;
        if (!!s !== was && !authBusy) boot();
      });
    }
  },
  async load(){
    if (sb) {
      const out = {};
      for (const t of ["partenaires","taches","notes","produits"]) {
        const { data, error } = await sb.from(t).select("*");
        if (error) throw error; out[t] = data;
      }
      db = out;
    } else {
      try { const s = JSON.parse(localStorage.getItem(LS) || "null"); db = s && s.partenaires ? s : structuredClone(SEED); } catch(e) { db = structuredClone(SEED); }
    }
    db.partenaires.sort((a,b) => a.nom.localeCompare(b.nom, "fr"));
  },
  async save(table, row){
    const i = db[table].findIndex(r => r.id === row.id);
    if (i >= 0) db[table][i] = row; else db[table].push(row);
    if (sb) { const { error } = await sb.from(table).upsert(row); if (error) { toast("Échec de l'enregistrement : " + error.message); throw error; } }
    else this.persistLocal();
  },
  async remove(table, id){
    db[table] = db[table].filter(r => r.id !== id);
    if (sb) { const { error } = await sb.from(table).delete().eq("id", id); if (error) { toast("Échec de la suppression : " + error.message); throw error; } }
    else this.persistLocal();
  },
  persistLocal(){ try { localStorage.setItem(LS, JSON.stringify(db)); } catch(e) { toast("Stockage du navigateur plein : retirez des fichiers volumineux."); } },
  async upload(file){
    if (sb) {
      const path = `${uid()}-${file.name.replace(/[^\w.\-]/g,"_")}`;
      const { error } = await sb.storage.from("fichiers").upload(path, file);
      if (error) { toast("Échec de l'envoi : " + error.message); throw error; }
      return sb.storage.from("fichiers").getPublicUrl(path).data.publicUrl;
    }
    if (file.size > 1.5*1024*1024) { toast("En mode local, choisissez un fichier de moins de 1,5 Mo."); throw new Error("size"); }
    return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); });
  }
};

/* ================= Habillage (barre haut, FAB, barre bas) ================= */
function chrome({title, back=false, acts=[], fabs=[], nav=null, form=false}){
  $("#title").textContent = title;
  $("#lead").innerHTML = back ? `<button class="ib" data-act="back" aria-label="Retour">${ic("i-back")}</button>` : `<button class="ib" data-act="menu" aria-label="Menu">${ic("i-menu")}</button>`;
  const A = {search:["i-search","Rechercher"], refresh:["i-refresh","Actualiser"], grid:["i-grid","Changer d'affichage"], check:["i-check","Vue Kanban"], trash:["i-trash","Supprimer"], dots:["i-dots","Plus d'actions"]};
  $("#acts").innerHTML = acts.map(a => `<button class="ib" data-act="${a}" aria-label="${A[a][1]}">${ic(A[a][0])}</button>`).join("");
  $("#fabs").innerHTML = fabs.map(f => `<button class="fab" data-fab="${f.k}" aria-label="${esc(f.label)}">${ic(f.icon)}</button>`).join("");
  $("#bottom").hidden = form; $("#formbar").hidden = !form;
  document.querySelectorAll("#bottom a").forEach(a => a.classList.toggle("on", a.dataset.nav === nav));
}

function barChart(tasks){
  const counts = STATUTS.map(s => tasks.filter(t => t.status === s).length);
  const max = Math.max(5, Math.ceil(Math.max(...counts) / 5) * 5);
  const W = 860, H = 280, L = 50, B = 50, top = 30, cw = (W - L - 40) / STATUTS.length;
  let g = `<text x="${L-14}" y="14" font-size="12" fill="#555">Count</text>`;
  for (let v = 0; v <= max; v += max/5) { const y = top + (H-top-B) * (1 - v/max); g += `<line x1="${L}" x2="${W-30}" y1="${y}" y2="${y}" stroke="#E3E3E3"/><text x="${L-10}" y="${y+4}" font-size="12" text-anchor="end" fill="#555">${v}</text>`; }
  counts.forEach((c,i) => { const x = L + i*cw + cw*0.15, h = (H-top-B) * c/max; g += `<rect x="${x}" y="${H-B-h}" width="${cw*0.7}" height="${h}" fill="#00CEC0"><title>${STATUTS[i]} : ${c}</title></rect><text transform="translate(${L+i*cw+cw/2},${H-B+16}) rotate(-35)" font-size="12" text-anchor="end" fill="#555">${STATUTS[i]}</text>`; });
  g += `<line x1="${L}" x2="${W-30}" y1="${H-B}" y2="${H-B}" stroke="#999"/><text transform="translate(${W-12},${H-B}) rotate(-90)" font-size="11" fill="#555">Status</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Nombre de tâches par statut">${g}</svg>`;
}

views.calendar = () => {
  chrome({title:"Calendar", acts:["search","grid","refresh"], nav:"calendar"});
  const tasks = db.taches.filter(t => match(t.task, t.activite, pNames(t)));
  const dated = tasks.filter(t => t.due).sort((a,b) => a.due.localeCompare(b.due));
  let up = "", last = "";
  for (const t of dated) { if (t.due !== last) { up += `<div class="update">${fmtD(t.due)}</div>`; last = t.due; }
    up += `<div class="upit" data-go="#/tache/${t.id}"><div class="r1"><span>${esc(t.task)}</span><small>${esc(t.status)}</small></div><div class="p">${esc(pNames(t))}</div><div class="c">${ic("i-chat")}</div></div>`; }
  if (!up) up = `<div class="empty" style="padding:20px;text-align:center">Aucune tâche datée.<br>Renseignez le champ Due d'une tâche.</div>`;
  const d = cal.d, todayIso = iso(new Date());
  const byDay = {}; for (const t of dated) (byDay[t.due] ||= []).push(t);
  const evts = day => (byDay[day]||[]).map(t => `<button class="evt" data-go="#/tache/${t.id}" title="${esc(t.task)}">${esc(t.task)}</button>`).join("");
  const days = ["lu","ma","me","je","ve","sa","di"];
  let body = "", label = "";
  if (cal.mode === "month") {
    label = d.toLocaleDateString("fr-FR", {month:"long", year:"numeric"});
    const first = new Date(d.getFullYear(), d.getMonth(), 1), off = (first.getDay()+6)%7, n = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    body = `<div class="month">` + days.map(x => `<div class="dh">${x}</div>`).join("");
    const cells = Math.ceil((off+n)/7)*7;
    for (let i = 0; i < cells; i++) { const day = i - off + 1;
      if (day < 1 || day > n) { body += `<div class="dc out"></div>`; continue; }
      const k = iso(new Date(d.getFullYear(), d.getMonth(), day));
      body += `<div class="dc"><span class="num ${k===todayIso?"today":""}">${String(day).padStart(2,"0")}</span>${evts(k)}</div>`; }
    body += `</div>`;
  } else if (cal.mode === "week") {
    const mon = new Date(d); mon.setDate(d.getDate() - (d.getDay()+6)%7);
    label = "Semaine du " + mon.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
    body = `<div class="month">` + days.map((x,i) => { const dd = new Date(mon); dd.setDate(mon.getDate()+i); return `<div class="dh">${x} ${dd.getDate()}</div>`; }).join("");
    for (let i = 0; i < 7; i++) { const dd = new Date(mon); dd.setDate(mon.getDate()+i); const k = iso(dd); body += `<div class="dc" style="min-height:300px">${k===todayIso?`<span class="num today">${dd.getDate()}</span>`:""}${evts(k)}</div>`; }
    body += `</div>`;
  } else {
    label = d.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
    const its = byDay[iso(d)] || [];
    body = `<div class="daylist">${its.length ? its.map(t => `<div class="upit" data-go="#/tache/${t.id}"><div class="r1"><span>${esc(t.task)}</span><small>${esc(t.status)}</small></div><div class="p">${esc(pNames(t))}</div></div>`).join("") : `<div class="empty">No items</div>`}</div>`;
  }
  $("#main").innerHTML = `<div class="cal"><section class="panel"><h2>Upcoming</h2><div class="uplist">${up}</div></section>
    <section class="panel"><h2>${cal.mode==="month"?"Month":cal.mode==="week"?"Week":"Day"}</h2>
    <div class="calmodes"><div class="m">${["day","week","month"].map(m => `<button data-cmode="${m}" class="${cal.mode===m?"on":""}">${m==="day"?"Day":m==="week"?"Week":"Month"}</button>`).join("")}</div><button class="today" data-cnav="0">TODAY</button></div>
    <div class="calnav"><button data-cnav="-1" aria-label="Précédent">${ic("i-left")}</button><span>${esc(label)}</span><button data-cnav="1" aria-label="Suivant">${ic("i-right")}</button></div>
    ${body}</section></div>`;
};

/* ================= Tableau de bord ================= */
function stats(tasks){
  const c = Object.fromEntries(STATUTS.map(s => [s, 0]));
  for (const t of tasks) c[t.status] = (c[t.status] || 0) + 1;
  const actives = tasks.length - c.Cancel, today = iso(new Date());
  return {c, n:tasks.length, actives, pct: actives ? Math.round(100 * c.Complete / actives) : 0,
    late: tasks.filter(t => t.due && t.due < today && t.status !== "Complete" && t.status !== "Cancel").length};
}
const groupBy = (arr, key) => { const m = new Map(); for (const x of arr) { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; };
const byFr = (a, b) => String(a).localeCompare(String(b), "fr");
const tipOf = st => STATUTS.filter(s => st.c[s]).map(s => `${SLAB[s]} : ${st.c[s]}`).join("<br>") || "Aucune tâche";
const pill = s => `<span class="st" style="background:${SCOL[s] || "#999"};color:${STXT[s] || "#fff"}">${esc(SLAB[s] || s)}</span>`;
/* Barre empilée par statut ; scale = largeur relative (0–1) pour les barres horizontales comparées */
function stackBar(st, {labels = false, scale = 1} = {}){
  if (!st.n) return `<div class="sbar empty" style="width:${scale*100}%"></div>`;
  return `<div class="sbar" style="width:${Math.max(scale*100, 2)}%" data-tip="${esc(tipOf(st))}">` + STATUTS.filter(s => st.c[s]).map(s =>
    `<span style="flex:${st.c[s]};background:${SCOL[s]};color:${STXT[s]}">${labels && st.c[s] / st.n * scale >= .06 ? st.c[s] : ""}</span>`).join("") + `</div>`;
}
const pbar = pct => `<div class="pbar"><div class="tk"><i style="width:${pct}%"></i></div><b>${pct} %</b></div>`;
function gauge(pct){
  const col = pct >= 67 ? SCOL.Complete : pct >= 34 ? SCOL["In Progress"] : SCOL["Not Started"];
  return `<svg class="gauge" viewBox="0 0 100 58" role="img" aria-label="${pct} %"><path d="M10 52 A40 40 0 0 1 90 52" fill="none" stroke="#E3E5E8" stroke-width="11" stroke-linecap="round"/>
    ${pct ? `<path d="M10 52 A40 40 0 0 1 90 52" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="${pct} 100"/>` : ""}
    <text x="50" y="50" text-anchor="middle" font-size="17" font-weight="600" fill="#222">${pct}%</text></svg>`;
}
function donut(st){
  const R = 70, C = 2 * Math.PI * R, gap = st.n > 1 ? 2 : 0; let off = 0;
  const segs = STATUTS.filter(s => st.c[s]).map(s => { const len = st.c[s] / st.n * C;
    const el = `<circle r="${R}" cx="95" cy="95" fill="none" stroke="${SCOL[s]}" stroke-width="26" stroke-dasharray="${Math.max(len - gap, .5)} ${C}" stroke-dashoffset="${-off}" data-tip="${esc(SLAB[s])} : ${st.c[s]} (${Math.round(100*st.c[s]/st.n)} %)"/>`;
    off += len; return el; }).join("");
  return `<div class="donut"><svg viewBox="0 0 190 190" role="img" aria-label="${esc(tipOf(st).replace(/<br>/g, ", "))}"><g transform="rotate(-90 95 95)">${segs || `<circle r="${R}" cx="95" cy="95" fill="none" stroke="#E3E5E8" stroke-width="26"/>`}</g>
    <text x="95" y="92" text-anchor="middle" font-size="30" font-weight="600" fill="#222">${st.n}</text><text x="95" y="114" text-anchor="middle" font-size="13" fill="#555">tâches</text></svg>
    <div class="legend">${STATUTS.map(s => `<span><i style="background:${SCOL[s]}"></i>${SLAB[s]} : <b>${st.c[s] || 0}</b> <span style="color:var(--muted)">(${st.n ? Math.round(100*(st.c[s]||0)/st.n) : 0} %)</span></span>`).join("")}</div></div>`;
}
let dash = {tab:"stats", p:""};
views.dashboard = () => {
  chrome({title:"Tableau de bord", acts:["refresh"], nav:"dashboard"});
  $("#tip").classList.remove("on");
  if (dash.p && !P(dash.p)) dash.p = "";
  const tasks = dash.p ? db.taches.filter(t => (t.partenaires || []).includes(dash.p)) : db.taches;
  const mineId = myP();
  let banner = "";
  if (sb && me && !me.actif) banner = `<div class="banner">Votre compte est en attente de validation par l'administrateur. Vous pouvez consulter le tableau de bord, mais pas encore modifier les activités.</div>`;
  else if (mineId && !isAdmin()) banner = `<div class="banner info">Connecté pour <b>${esc(P(mineId)?.nom || "votre structure")}</b> : vous pouvez mettre à jour les activités de votre structure.</div>`;
  else if (sb && me && !me.partenaire_id && me.role !== "admin") banner = `<div class="banner">Votre compte n'est rattaché à aucune structure. Contactez l'administrateur.</div>`;
  const bar = `<div class="dbar"><div class="seg" role="tablist"><button role="tab" data-dtab="stats" class="${dash.tab === "stats" ? "on" : ""}">Statistiques</button><button role="tab" data-dtab="synth" class="${dash.tab === "synth" ? "on" : ""}">Synthèse des activités</button></div>
    <select id="dashP" aria-label="Filtrer par partenaire"><option value="">Tous les partenaires</option>${db.partenaires.map(p => `<option value="${p.id}" ${p.id === dash.p ? "selected" : ""}>${esc(p.nom)}${p.id === mineId ? " (ma structure)" : ""}</option>`).join("")}</select></div>`;
  $("#main").innerHTML = `<div class="dash">${bar}${banner}${dash.tab === "stats" ? dashStats(tasks) : dashSynth(tasks)}</div>`;
};
function dashStats(tasks){
  const all = stats(tasks);
  // Activités et piliers « finalisés » : toutes leurs tâches (hors annulées) sont achevées
  const acts = [...groupBy(tasks, t => (t.pilier || "Non rattaché") + "\u0000" + (t.activite || "(sans activité)"))]
    .map(([k, ts]) => { const [pilier, nom] = k.split("\u0000"); return {nom, ts, st:stats(ts), pilier}; });
  const actFin = a => a.st.actives > 0 && a.st.c.Complete === a.st.actives;
  const pil = [...groupBy(acts, a => a.pilier)].map(([nom, as]) => ({nom, as, nb:as.length, fin:as.filter(actFin).length}))
    .map(x => ({...x, pct: x.nb ? Math.round(100 * x.fin / x.nb) : 0, st:stats(x.as.flatMap(a => a.ts))})).sort((a, b) => b.pct - a.pct || b.st.n - a.st.n);
  const nActFin = acts.filter(actFin).length, nPilFin = pil.filter(x => x.nb && x.fin === x.nb).length;
  const kpi = (l, v, sub = "", cls = "") => `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}${sub ? ` <small>${sub}</small>` : ""}</div></div>`;
  const parts = db.partenaires.map(p => ({p, st:stats(tasks.filter(t => (t.partenaires || []).includes(p.id)))})).filter(x => x.st.n).sort((a, b) => b.st.n - a.st.n || byFr(a.p.nom, b.p.nom));
  const max = Math.max(1, ...parts.map(x => x.st.n));
  const pilTable = `<div class="gtw"><table class="gt"><thead><tr><th>Pilier PNDS</th><th class="n">Activités</th><th class="n">Finalisées</th><th style="text-align:center">Progression</th></tr></thead><tbody>` +
    pil.map(x => `<tr class="r"><td>${esc(x.nom)}</td><td class="n">${x.nb}</td><td class="n">${x.fin}</td><td style="text-align:center">${gauge(x.pct)}</td></tr>`).join("") + `</tbody></table></div>`;
  const actGroups = [...groupBy([...acts].sort((a, b) => byFr(a.pilier, b.pilier) || b.st.pct - a.st.pct || byFr(a.nom, b.nom)), a => a.pilier)];
  const implTable = `<div class="gtw"><table class="gt"><caption><b>État de mise en œuvre des activités</b><span>Nombre de tâches, part des tâches achevées et répartition des statuts pour chaque activité</span></caption>
    <thead><tr class="sp"><th></th><th></th><th></th><th>Répartition des statuts</th><th></th></tr><tr><th>Activité</th><th class="n">Nombre total de tâches</th><th class="n">% tâches achevées</th><th style="min-width:180px">${STATUTS.map(s => `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:.78rem;font-weight:400"><i style="width:9px;height:9px;border-radius:2px;background:${SCOL[s]};display:inline-block"></i>${SLAB[s]}</span>`).join("")}</th><th style="min-width:150px">Progression des tâches achevées</th></tr></thead><tbody>` +
    actGroups.map(([pl, as]) => `<tr class="grp"><td colspan="5">${esc(pl)}<small>${as.length} activité(s)</small></td></tr>` + as.map(a =>
      `<tr class="r"><td>${esc(a.nom)}</td><td class="n">${a.st.n}</td><td class="n">${a.st.pct} %</td><td>${stackBar(a.st)}</td><td>${pbar(a.st.pct)}</td></tr>`).join("")).join("") +
    `</tbody><tfoot><tr><td colspan="5">% calculé hors tâches annulées. Survolez une barre pour le détail.</td></tr></tfoot></table></div>`;
  return `<div class="kpis">${kpi("Tâches suivies", all.n)}${kpi("Tâches achevées", all.c.Complete, `/ ${all.actives} · ${all.pct} %`)}${kpi("Activités finalisées", nActFin, `/ ${acts.length}`)}${kpi("Piliers finalisés", nPilFin, `/ ${pil.length}`)}${kpi("Tâches en retard", all.late, "", all.late ? "warn" : "")}</div>
    <div class="dgrid">
      <section class="card"><h2>Activités finalisées par pilier PNDS</h2><p class="sub">Une activité est finalisée quand toutes ses tâches (hors annulées) sont achevées.</p><div class="cb">${pil.length ? pilTable : "Aucune activité."}</div></section>
      <section class="card"><h2>Répartition des tâches par statut</h2><p class="sub">${dash.p ? esc(P(dash.p)?.nom || "") : "Ensemble des partenaires"}</p><div class="cb">${donut(all)}</div></section>
    </div>
    <section class="card"><h2>Répartition des tâches des partenaires par statut</h2><p class="sub">Nombre de tâches par partenaire (une tâche partagée compte pour chacun de ses partenaires)</p>
      <div class="cb"><div class="legend" style="margin-bottom:14px">${STATUTS.map(s => `<span><i style="background:${SCOL[s]}"></i>${SLAB[s]}</span>`).join("")}</div>
      ${parts.length ? `<div class="hbars">${parts.map(x => `<button class="nm" data-go="#/partenaire/${x.p.id}" style="background:none;border:0;padding:0;cursor:pointer" title="${esc(x.p.nom)}">${esc(x.p.nom)}</button><div class="tr">${stackBar(x.st, {labels:true, scale:x.st.n / max})}<span class="tot">${x.st.n}</span></div>`).join("")}</div>` : "Aucune tâche."}</div></section>
    <section class="card">${acts.length ? implTable : `<div class="cb">Aucune activité.</div>`}</section>`;
}
function dashSynth(tasks){
  const rows = [...tasks].sort((a, b) => byFr(a.pilier || "~", b.pilier || "~") || byFr(a.activite, b.activite) || STATUTS.indexOf(a.status) - STATUTS.indexOf(b.status));
  const groups = [...groupBy(rows, t => t.pilier || "Non rattaché")];
  return `<section class="card"><div class="gtw"><table class="gt"><caption><b>Plan des partenaires SNIS</b><span>État détaillé de la mise en œuvre, par pilier PNDS et par activité${dash.p ? ` · ${esc(P(dash.p)?.nom || "")}` : ""}</span></caption>
    <thead><tr><th>Activité</th><th>Tâche</th><th>Partenaire(s)</th><th>Direction</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>` +
    (groups.length ? groups.map(([pl, ts]) => { let last = null; const st = stats(ts);
      return `<tr class="grp"><td colspan="6">${esc(pl)}<small>${ts.length} tâche(s) · ${st.pct} % achevées</small></td></tr>` + ts.map(t => { const cont = t.activite === last; last = t.activite;
        return `<tr class="r ${cont ? "cont-row" : ""}" data-go="#/tache/${t.id}"><td class="act">${esc(t.activite)}</td><td class="wrap">${esc(t.task)}</td><td>${esc(pNames(t))}</td><td>${esc(t.direction || "")}</td><td style="white-space:nowrap">${fmtD(t.due)}</td><td>${pill(t.status)}</td></tr>`; }).join(""); }).join("")
      : `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px">Aucune tâche.</td></tr>`) +
    `</tbody><tfoot><tr><td colspan="6">${tasks.length} tâche(s). Cliquez sur une ligne pour ouvrir la tâche.</td></tr></tfoot></table></div></section>`;
}
/* Info-bulle au survol des graphiques */
document.addEventListener("scroll", () => $("#tip").classList.remove("on"), true);
document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"), tip = $("#tip");
  if (!el) return tip.classList.remove("on"); tip.innerHTML = el.dataset.tip; tip.classList.add("on"); });
document.addEventListener("mousemove", e => { const tip = $("#tip"); if (!tip.classList.contains("on")) return;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px"; });

views.comptes = async () => {
  if (!sb || !isAdmin()) return go("#/dashboard", true);
  chrome({title:"Comptes utilisateurs", back:true, acts:["refresh"]});
  $("#main").innerHTML = `<div class="empty">Chargement…</div>`;
  const { data, error } = await sb.from("profils").select("*").order("created_at");
  if (location.hash !== "#/comptes") return;
  if (error) { $("#main").innerHTML = `<div class="empty">Impossible de charger les comptes : ${esc(error.message)}</div>`; return; }
  const pend = data.filter(u => !u.actif).length;
  $("#main").innerHTML = `<div class="list"><h3>${data.length} compte(s)${pend ? ` · <b>${pend} en attente de validation</b>` : ""}</h3>` + data.map(u => `<div class="acct" data-uid="${u.user_id}">
      <div class="ae"><div class="t">${esc(u.email)}</div><div class="s ${u.actif ? "" : "pend"}">${u.actif ? "Validé" : "En attente de validation"} · inscrit le ${esc(new Date(u.created_at).toLocaleDateString("fr-FR"))}</div></div>
      <select data-f="partenaire_id" aria-label="Structure"><option value="">— Aucune structure —</option>${db.partenaires.map(p => `<option value="${p.id}" ${p.id === u.partenaire_id ? "selected" : ""}>${esc(p.nom)}</option>`).join("")}</select>
      <select data-f="role" aria-label="Rôle"><option value="partenaire" ${u.role === "partenaire" ? "selected" : ""}>Structure</option><option value="admin" ${u.role === "admin" ? "selected" : ""}>Administrateur</option></select>
      <label><input type="checkbox" data-f="actif" ${u.actif ? "checked" : ""}> Validé</label>
    </div>`).join("") + `</div>`;
};
async function saveAccount(el){
  const row = el.closest("[data-uid]"), uid = row.dataset.uid, f = el.dataset.f;
  const val = f === "actif" ? el.checked : (el.value || null);
  if (uid === session.user.id && ((f === "role" && val !== "admin") || (f === "actif" && !val))) {
    toast("Vous ne pouvez pas retirer vos propres droits d'administrateur."); return views.comptes();
  }
  const { error } = await sb.from("profils").update({[f]: val}).eq("user_id", uid);
  if (error) { toast("Échec : " + error.message); return views.comptes(); }
  toast("Compte mis à jour");
  if (f === "actif") views.comptes();
}

/* ================= Formulaires ================= */
function formRow(label, html, req){ return `<div class="frow"><label>${esc(label)}${req?` <span class="req">*</span>`:""}</label><div>${html}</div></div>`; }
function openForm(title, html, onSave, back){
  chrome({title, back:true, form:true});
  formState = {onSave, back};
  $("#main").innerHTML = `<form class="form" id="frm" onsubmit="return false">${html}</form>`;
}

views.tacheForm = (id) => {
  if (id ? !(T(id) && canEditTask(T(id))) : !canCreate()) { toast("Vous ne pouvez modifier que les activités de votre structure."); return go("#/dashboard", true); }
  const mine = isAdmin() ? null : myP();
  const t = id ? T(id) : {id:uid(), partenaires:[], activite:"", task:"", due:"", status:"Not Started", direction:"", pilier:"", snsc:"", numerique:""};
  if (mine && !t.partenaires.includes(mine)) t.partenaires = [...t.partenaires, mine];
  const dl = (n, arr) => `<datalist id="${n}">${[...new Set(arr.filter(Boolean))].sort().map(v => `<option value="${esc(v)}">`).join("")}</datalist>`;
  openForm(id ? "Modifier la tâche" : "Nouvelle activité",
    formRow("Partenaires", `<div class="checks">${db.partenaires.map(p => `<label><input type="checkbox" name="pt" value="${p.id}" ${t.partenaires.includes(p.id)?"checked":""} ${p.id===mine?"disabled":""}> ${esc(p.nom)}</label>`).join("")}</div>`, true) +
    formRow("Activité", `<input name="activite" list="dlA" value="${esc(t.activite)}" required>${dl("dlA", db.taches.map(x=>x.activite))}`, true) +
    formRow("Task", `<textarea name="task" required>${esc(t.task)}</textarea>`, true) +
    formRow("Due", `<input type="date" name="due" value="${esc(t.due||"")}">`) +
    formRow("Status", `<select name="status">${STATUTS.map(s => `<option ${s===t.status?"selected":""}>${s}</option>`).join("")}</select>`) +
    formRow("Direction", `<input name="direction" list="dlD" value="${esc(t.direction)}">${dl("dlD", db.taches.map(x=>x.direction))}`) +
    formRow("Pilier PNDS", `<select name="pilier"><option value="">À rattacher</option>${PILIERS.map(p => `<option ${p===t.pilier?"selected":""}>${p}</option>`).join("")}</select>`) +
    formRow("Lien santé communautaire (SNSC)", `<input name="snsc" list="dlS" value="${esc(t.snsc)}">${dl("dlS", db.taches.map(x=>x.snsc))}`) +
    formRow("Lien santé numérique", `<input name="numerique" list="dlN" value="${esc(t.numerique)}">${dl("dlN", db.taches.map(x=>x.numerique))}`),
    async f => {
      const pts = [...f.querySelectorAll("input[name=pt]:checked")].map(x => x.value);
      if (mine && !pts.includes(mine)) pts.push(mine);
      if (!pts.length) return toast("Choisissez au moins un partenaire.");
      if (!f.activite.value.trim() || !f.task.value.trim()) return toast("Renseignez l'activité et la tâche.");
      await Store.save("taches", {...t, partenaires:pts, activite:f.activite.value.trim(), task:f.task.value.trim(), due:f.due.value||null, status:f.status.value, direction:f.direction.value.trim(), pilier:f.pilier.value, snsc:f.snsc.value.trim(), numerique:f.numerique.value.trim()});
      selTask = t.id; toast(id ? "Tâche mise à jour" : "Activité ajoutée"); go("#/tache/" + t.id, true);
    }, id ? "#/tache/" + id : "#/tracker");
};

views.partenaireForm = (id) => {
  if (id ? !(P(id) && canEditPartner(P(id))) : !isAdmin()) { toast("Action réservée à l'administrateur."); return go("#/partenaires", true); }
  const p = id ? P(id) : {id:uid(), nom:"", email:"", contacts:"", photo:""};
  let photo = p.photo;
  openForm(id ? "Modifier le partenaire" : "Nouveau partenaire",
    formRow("Nom", `<input name="nom" value="${esc(p.nom)}" required>`, true) +
    formRow("Email", `<input type="email" name="email" value="${esc(p.email)}">`) +
    formRow("Personnes à contacter", `<input name="contacts" value="${esc(p.contacts)}">`) +
    formRow("Photo", `<div class="filebox" id="photoBox">${photo ? `<img src="${esc(photo)}" alt="">` : "Touchez pour choisir le logo"}</div><input name="photoUrl" placeholder="…ou collez l'adresse (URL) d'une image" style="margin-top:10px" value="${photo && !photo.startsWith("data:") ? esc(photo) : ""}">`),

function noteForm(tid){
  openForm("Nouvelle note", formRow("Note", `<textarea name="texte" required></textarea>`, true), async f => {
    if (!f.texte.value.trim()) return toast("Écrivez la note.");

function pickFile(accept, cb){ const fp = $("#filePick"); fp.accept = accept; fp.value = ""; fp.onchange = () => { if (fp.files[0]) Promise.resolve().then(() => cb(fp.files[0])).catch(() => {}); }; fp.click(); }

/* ================= Menus, confirmations ================= */
function sheet(title, items){
  $("#sheetBox").innerHTML = (title ? `<h4>${esc(title)}</h4>` : "") + items.map((it,i) => `<button data-si="${i}" ${it.danger?'style="color:var(--danger)"':""}>${esc(it.label)}</button>`).join("");
  $("#sheet").classList.add("on");
  $("#sheetBox").onclick = e => { const b = e.target.closest("button"); if (!b) return; $("#sheet").classList.remove("on"); items[+b.dataset.si].run(); };
}
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") $("#sheet").classList.remove("on"); });
function confirmDel(label, run){ sheet(label, [{label:"Supprimer", danger:true, run}, {label:"Annuler", run(){}}]); }
function taskMenu(id){
  const t = T(id); if (!t || !canEditTask(t)) return;
  sheet(t.task.slice(0,80) + (t.task.length>80?"…":""), [
    ...STATUTS.filter(s => s !== t.status).map(s => ({label:"Passer en « " + s + " »", async run(){ await Store.save("taches", {...t, status:s}); toast("Statut : " + s); render(); }})),
    {label:"Ajouter une note", run(){ noteForm(id); }},
    {label:"Modifier", run(){ go("#/tache-edit/" + id); }},
    ...(isAdmin() ? [{label:"Supprimer", danger:true, run(){ confirmDel("Supprimer cette tâche ?", () => delTask(id)); }}] : [])
  ]);
}
async function delTask(id){
  for (const n of db.notes.filter(n => n.tache_id === id)) await Store.remove("notes", n.id);
  await Store.remove("taches", id); if (selTask === id) selTask = null; toast("Tâche supprimée"); render();
}

/* ================= Routage ================= */
function go(h, replace){ if (replace) { history.replaceState(null, "", h); render(); } else location.hash = h; }
function render(){
  if (sb && (!session || recovering)) return;
  const [, v = "dashboard", arg] = (location.hash.startsWith("#/") ? location.hash : "#/dashboard").split("/");
  formState = null;
  closeDrawer();
  if (v === "partenaire" && arg === "new") return views.partenaireForm(null);
  if (v === "partenaire-edit") return views.partenaireForm(arg);
  if (v === "tache-edit") return views.tacheForm(arg);
  if (v === "produit" && arg === "new") return views.produitForm();
  (views[v] || views.dashboard)(arg);
}
window.addEventListener("hashchange", render);

/* ================= Événements globaux ================= */
function openDrawer(){ $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); }
function closeDrawer(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); $("#sheet").classList.remove("on"); } });

document.addEventListener("click", async e => {
  const g = e.target.closest("[data-go]"); 
  const more = e.target.closest("[data-more]");
  const delp = e.target.closest("[data-delprod]");
  if (delp) { e.preventDefault(); e.stopPropagation(); const id = delp.dataset.delprod; confirmDel("Supprimer ce produit ?", async () => { await Store.remove("produits", id); toast("Produit supprimé"); render(); }); return; }
  if (more) { e.stopPropagation(); return taskMenu(more.dataset.more); }
  const selc = e.target.closest("[data-sel]");
  if (selc) { selTask = selc.dataset.sel; if (matchMedia("(max-width:900px)").matches) return go("#/tache/" + selTask); return views.tracker(); }
  if (g) return go(g.dataset.go);
  const dt = e.target.closest("[data-dtab]"); if (dt) { dash.tab = dt.dataset.dtab; return views.dashboard(); }
  const cm = e.target.closest("[data-cmode]"); if (cm) { cal.mode = cm.dataset.cmode; return views.calendar(); }
  const cn = e.target.closest("[data-cnav]"); if (cn) { const k = +cn.dataset.cnav; if (!k) cal.d = new Date(); else { const d = new Date(cal.d); if (cal.mode==="month") d.setMonth(d.getMonth()+k, 1); else d.setDate(d.getDate() + k*(cal.mode==="week"?7:1)); cal.d = d; } return views.calendar(); }
  const fab = e.target.closest("[data-fab]");
  if (fab) {
    const [, v, arg] = location.hash.split("/");
    const k = fab.dataset.fab, tid = fab.dataset.id || arg;
    if (k === "newP") return go("#/partenaire/new");
    if (k === "editP") return go("#/partenaire-edit/" + arg);
    if (k === "editT") return go("#/tache-edit/" + tid);
    if (k === "note") return noteForm(tid);
    if (k === "newProd") return go("#/produit/new");
  }
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.dataset.act, [, v, arg] = location.hash.split("/");
    if (act === "menu") return openDrawer();
    if (act === "back") return formState && formState.back ? go(formState.back, true) : (history.length > 1 ? history.back() : go("#/partenaires"));
    if (act === "search") { const sbx = $("#searchbar"); sbx.hidden = !sbx.hidden; if (!sbx.hidden) $("#q").focus(); else { q = ""; $("#q").value = ""; render(); } return; }
    if (act === "refresh") { await reload(); return toast("Données actualisées"); }
    if (act === "grid") return go(v === "calendar" ? "#/tracker" : "#/tracker-inline");
    if (act === "check") return go("#/tracker");
    if (act === "trash" && isAdmin()) {
      if (v === "partenaire") return confirmDel("Supprimer ce partenaire ? Ses tâches restent dans le tracker.", async () => { await Store.remove("partenaires", arg); for (const t of db.taches.filter(t => (t.partenaires||[]).includes(arg))) await Store.save("taches", {...t, partenaires:t.partenaires.filter(x => x !== arg)}); toast("Partenaire supprimé"); go("#/partenaires", true); });
      if (v === "tache") return confirmDel("Supprimer cette tâche ?", async () => { await delTask(arg); go("#/tracker", true); });
    }
    if (act === "dots" && v === "partenaire") return sheet(null, [...(P(arg) && canEditPartner(P(arg)) ? [{label:"Modifier", run(){ go("#/partenaire-edit/" + arg); }}] : []), ...(canCreate() ? [{label:"Ajouter une tâche", run(){ go("#/tache/new"); }}] : []), {label:"Écrire un email", run(){ const p = P(arg); p?.email ? location.href = "mailto:" + p.email : toast("Aucun email renseigné."); }}]);
    if (act === "reset") return confirmDel("Remplacer les données locales par les données initiales ?", () => { localStorage.removeItem(LS); reload(); toast("Données réinitialisées"); });
  }
});
document.addEventListener("change", async e => {
  if (e.target.id === "dashP") { dash.p = e.target.value; return views.dashboard(); }
  const af = e.target.closest("[data-f]"); if (af && af.closest(".acct")) return saveAccount(af);
  const d = e.target.closest("[data-due]");
  if (d) { const t = T(d.dataset.due); if (t && canEditTask(t)) { await Store.save("taches", {...t, due:d.value || null}); toast("Échéance enregistrée"); } }
});
$("#q").addEventListener("input", e => { q = e.target.value; render(); });
$("#fCancel").onclick = () => formState && (formState.back ? go(formState.back, true) : history.back());
$("#fSave").onclick = async () => { if (!formState) return; const b = $("#fSave"); b.disabled = true; try { await formState.onSave($("#frm")); } catch(err) { console.error(err); } finally { b.disabled = false; } };
$("#shareBtn").onclick = async () => { closeDrawer(); const url = location.href.split("#")[0]; try { if (navigator.share) await navigator.share({title:CFG.APP_NAME, url}); else { await navigator.clipboard.writeText(url); toast("Lien copié"); } } catch(e){} };
$("#exportBtn").onclick = () => {
  closeDrawer();
  const cols = [["Partenaires",t=>pNames(t)],["Activité",t=>t.activite],["Task",t=>t.task],["Due",t=>fmtD(t.due)],["Status",t=>t.status],["Direction",t=>t.direction],["Pilier PNDS",t=>t.pilier],["Lien SNSC",t=>t.snsc],["Lien santé numérique",t=>t.numerique],["Notes",t=>db.notes.filter(n=>n.tache_id===t.id).map(n=>n.texte).join(" | ")]];
  const c = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const csv = "\ufeff" + [cols.map(x=>x[0]).join(";"), ...db.taches.map(t => cols.map(x => c(x[1](t))).join(";"))].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = `tracker_partenaires_snis_${iso(new Date())}.csv`; document.body.appendChild(a); a.click(); a.remove();
};
$("#pwBtn").onclick = () => {
  closeDrawer();
  openForm("Changer mon mot de passe",
    formRow("Nouveau mot de passe", `<input type="password" name="p1" autocomplete="new-password" placeholder="8 caractères minimum">`, true) +
    formRow("Confirmation", `<input type="password" name="p2" autocomplete="new-password">`, true),
    async f => {
      if (f.p1.value.length < 8) return toast("Le mot de passe doit contenir au moins 8 caractères.");
      if (f.p1.value !== f.p2.value) return toast("Les deux mots de passe ne correspondent pas.");
      const { error } = await sb.auth.updateUser({ password: f.p1.value });
      if (error) return toast(authErr(error));
      toast("Mot de passe modifié"); go("#/dashboard", true);
    }, "#/dashboard");
};
$("#logout").onclick = async () => { closeDrawer(); await sb.auth.signOut(); };

/* ================= Démarrage ================= */
async function reload(){ await Store.load(); render(); }
const APPN = () => CFG.APP_NAME || "Plan des partenaires SNIS";
const baseUrl = () => location.href.split("#")[0];
function authShell(inner){
  chrome({title:APPN()});
  $("#lead").innerHTML = ""; $("#bottom").hidden = true; $("#fabs").innerHTML = "";
  $("#main").innerHTML = `<div class="login"><span class="applogo">${$(".appbar .applogo").innerHTML}</span><h2 style="font-weight:400;margin:0">${esc(APPN())}</h2>${inner}<p class="lmsg" id="loginMsg" role="status"></p></div>`;
}
function lmsg(t, err){ const m = $("#loginMsg"); m.textContent = t; m.classList.toggle("err", !!err); }
function authErr(error){
  if (error.status === 429) return "Trop de demandes : patientez une minute puis réessayez.";
  if (/Invalid login credentials/i.test(error.message)) return "Email ou mot de passe incorrect.";
  if (/Email not confirmed/i.test(error.message)) return "Confirmez d'abord votre adresse email avec le lien reçu, puis reconnectez-vous.";
  if (/Password should be/i.test(error.message)) return "Mot de passe trop faible : au moins 8 caractères.";
  return "Échec : " + error.message;
}
async function loadStructures(){
  if (!structures) { const { data, error } = await sb.rpc("liste_structures"); structures = error ? [] : data; }
  return structures;
}
async function loadMe(){
  await sb.rpc("creer_mon_profil");
  const { data } = await sb.from("profils").select("*").eq("user_id", session.user.id).maybeSingle();
  me = data || null;
}
async function loginScreen(mode = "login"){
  const st = await loadStructures();
  const sel = admin => `<select id="lStruct" aria-label="Structure" required><option value="">Nom de la structure…</option>${admin ? `<option value="admin">Administration SNIS (administrateur)</option>` : ""}${st.map(p => `<option value="${p.id}">${esc(p.nom)}</option>`).join("")}</select>`;
  const tabs = `<div class="ltabs"><button data-lmode="login" class="${mode === "login" ? "on" : ""}">Se connecter</button><button data-lmode="signup" class="${mode === "signup" ? "on" : ""}">Créer un compte</button></div>`;
  const mail = `<input id="lMail" type="email" placeholder="Adresse email" aria-label="Adresse email" autocomplete="email">`;
  if (mode === "login") authShell(tabs + `<form class="lf" onsubmit="return false">${sel(true)}${mail}
      <input id="lPass" type="password" placeholder="Mot de passe" aria-label="Mot de passe" autocomplete="current-password">
      <button class="btnp" id="lGo">Se connecter</button></form><button class="lnk" data-lmode="forgot">Mot de passe oublié ?</button>`);
  else if (mode === "signup") authShell(tabs + `<p style="color:var(--muted);margin:14px 0 0">Créez le compte de votre structure. L'administrateur le validera avant que vous puissiez modifier vos activités.</p>
      <form class="lf" onsubmit="return false">${sel(false)}${mail}
      <input id="lPass" type="password" placeholder="Mot de passe (8 caractères minimum)" aria-label="Mot de passe" autocomplete="new-password">
      <input id="lPass2" type="password" placeholder="Confirmez le mot de passe" aria-label="Confirmation du mot de passe" autocomplete="new-password">
      <button class="btnp" id="lGo">Créer le compte</button></form>`);
  else authShell(`<p style="color:var(--muted);margin:18px 0 0">Saisissez votre adresse email : vous recevrez un lien pour choisir un nouveau mot de passe.</p>
      <form class="lf" onsubmit="return false">${mail}<button class="btnp" id="lGo">Recevoir le lien</button></form><button class="lnk" data-lmode="login">Retour à la connexion</button>`);
  $("#main").querySelectorAll("[data-lmode]").forEach(b => b.onclick = () => loginScreen(b.dataset.lmode));
  $("#lGo").onclick = async () => {
    const btn = $("#lGo"); if (btn.disabled) return;
    const email = $("#lMail").value.trim(), pass = $("#lPass")?.value || "", struct = $("#lStruct")?.value;
    if (mode !== "forgot" && !struct) return lmsg("Choisissez le nom de votre structure.", true);
    if (!email) return lmsg("Saisissez votre adresse email.", true);
    if (mode !== "forgot" && !pass) return lmsg("Saisissez votre mot de passe.", true);
    if (mode === "signup" && pass.length < 8) return lmsg("Le mot de passe doit contenir au moins 8 caractères.", true);
    if (mode === "signup" && pass !== $("#lPass2").value) return lmsg("Les deux mots de passe ne correspondent pas.", true);
    btn.disabled = true; lmsg("Veuillez patienter…");
    try {
      if (mode === "forgot") {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: baseUrl() });
        return error ? lmsg(authErr(error), true) : lmsg("Si un compte existe pour cette adresse, un email vient de vous être envoyé.");
      }
      if (mode === "signup") {
        authBusy = true;
        const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { partenaire_id: struct }, emailRedirectTo: baseUrl() } });
        authBusy = false;
        if (error) return lmsg(authErr(error), true);
        if (data.user && data.user.identities && !data.user.identities.length) return lmsg("Un compte existe déjà pour cette adresse. Connectez-vous ou utilisez « Mot de passe oublié ».", true);
        if (data.session) { session = data.session; return boot(); }
        return lmsg("Compte créé. Ouvrez l'email de confirmation que vous venez de recevoir, puis connectez-vous. L'administrateur validera ensuite votre compte.");
      }
      authBusy = true;
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) { authBusy = false; return lmsg(authErr(error), true); }
      session = data.session; await loadMe();
      const ok = me && (me.role === "admin" || (struct !== "admin" && me.partenaire_id === struct));
      if (!ok) {
        await sb.auth.signOut(); session = null; me = null; authBusy = false;
        return lmsg(struct === "admin" ? "Ce compte n'a pas les droits d'administrateur." : "Ce compte n'est pas rattaché à la structure choisie.", true);
      }
      authBusy = false; boot();
    } finally { btn.disabled = false; }
  };
}
function recoveryScreen(){
  authShell(`<p style="color:var(--muted);margin:18px 0 0">Choisissez votre nouveau mot de passe.</p>
    <form class="lf" onsubmit="return false"><input id="lPass" type="password" placeholder="Nouveau mot de passe (8 caractères minimum)" aria-label="Nouveau mot de passe" autocomplete="new-password">
    <input id="lPass2" type="password" placeholder="Confirmez le mot de passe" aria-label="Confirmation du mot de passe" autocomplete="new-password">
    <button class="btnp" id="lGo">Enregistrer</button></form>`);
  $("#lGo").onclick = async () => {
    const pass = $("#lPass").value;
    if (pass.length < 8) return lmsg("Le mot de passe doit contenir au moins 8 caractères.", true);
    if (pass !== $("#lPass2").value) return lmsg("Les deux mots de passe ne correspondent pas.", true);
    $("#lGo").disabled = true;
    const { error } = await sb.auth.updateUser({ password: pass });
    $("#lGo").disabled = false;
    if (error) return lmsg(authErr(error), true);
    recovering = false; history.replaceState(null, "", baseUrl() + "#/dashboard"); toast("Mot de passe enregistré"); boot();
  };
}
function applyAccess(){
  $("#navNew").hidden = !canCreate();
  $("#navComptes").hidden = !(sb && isAdmin());
  if (!sb) return;
  const role = me?.role === "admin" ? "Administrateur" : me?.partenaire_id ? (P(me.partenaire_id)?.nom || "Structure") + (me.actif ? "" : " (en attente de validation)") : "Aucune structure";
  $("#uMail").innerHTML = `${esc(session.user.email)}<br><small>${esc(role)}</small>`;
  $("#uAv").textContent = (session.user.email || "?")[0].toUpperCase(); $("#logout").hidden = false; $("#pwBtn").hidden = false;
}
async function boot(){
  $("#dLogo").innerHTML = $(".appbar .applogo").innerHTML; $("#dName").textContent = APPN(); document.title = APPN();
  if (sb && recovering && session) return recoveryScreen();
  if (sb && !session) return loginScreen();
  try { if (sb && (!me || me.user_id !== session.user.id)) await loadMe(); await Store.load(); }
  catch(err) { $("#main").innerHTML = `<div class="login"><h2 style="font-weight:400">Connexion à la base impossible</h2><p style="color:var(--muted)">${esc(err.message || err)}</p></div>`; return; }
  applyAccess();
  if (!location.hash.startsWith("#/")) history.replaceState(null, "", baseUrl() + "#/dashboard");
  render();
}
Store.init().then(boot).catch(err => { toast("Supabase indisponible : passage en mode local"); sb = null; boot(); });
</script>
</body>
</html>
